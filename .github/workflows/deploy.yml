name: Deploy to Fly.io

on:
  push:
    branches:
      - master
    # Mudanças só de documentação não reimplantam o backend (não reiniciam a
    # máquina no Fly em cima de quem está usando o app/painel).
    paths-ignore:
      - 'AGENTS.md'
      - 'tasks/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - master

concurrency:
  group: deploy-group
  cancel-in-progress: true

jobs:
  flutter-checks:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  backend-checks:
    name: Backend (isolated tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run isolated test suite
        working-directory: backend
        run: python -B tests/run_isolated.py

  dependency-scan:
    name: Dependency scan (pip-audit + osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

      - name: osv-scanner (pubspec.lock)
        # Só o lockfile do Dart: o pip-audit já cobre o Python (e o parser de
        # requirements.txt do osv-scanner resolve transitivas de forma imprecisa).
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            scan
            -L
            pubspec.lock

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [flutter-checks, backend-checks, dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
